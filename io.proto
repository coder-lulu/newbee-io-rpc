syntax = "proto3";

package io;
option go_package = "./io";

message ApprovalReq {
  uint64 id = 1;
  string action = 2;
  optional string reason = 3;
  optional uint64 approved_by = 4;
}

message BaseIDInt32Resp {
  int32 id = 1;
  string msg = 2;
}

message BaseIDInt64Resp {
  int64 id = 1;
  string msg = 2;
}

message BaseIDResp {
  uint64 id = 1;
  string msg = 2;
}

message BaseIDStringResp {
  string id = 1;
  string msg = 2;
}

message BaseIDUint32Resp {
  uint32 id = 1;
  string msg = 2;
}

message BaseResp {
  string msg = 1;
}

message BaseUUIDResp {
  string id = 1;
  string msg = 2;
}

message CronTaskInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  //  任务名称
  optional string task_name = 5;
  //  Cron表达式, 例如: 0 3 * * * (每天凌晨3点), 0 */6 * * * (每6小时)
  optional string cron_expression = 6;
  //  数据源类型, 例如: vmware_vcenter, aliyun_ecs等
  optional string input_source = 7;
  //  数据源配置JSON字符串
  optional string source_config = 8;
  //  是否启用此Cron任务
  optional bool enabled = 9;
  //  下次执行时间（由调度器自动更新）
  optional int64 next_run_time = 10;
  //  上次执行时间
  optional int64 last_run_time = 11;
  //  总执行次数
  optional int64 execution_count = 12;
  //  成功次数
  optional int64 success_count = 13;
  //  失败次数
  optional int64 failure_count = 14;
  //  任务描述信息
  optional string description = 15;
}

message CronTaskListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string task_name = 6;
  optional string cron_expression = 7;
  optional string input_source = 8;
  optional string source_config = 9;
  optional bool enabled = 10;
  optional int64 next_run_time = 11;
  optional int64 last_run_time = 12;
  optional int64 execution_count = 13;
  optional int64 success_count = 14;
  optional int64 failure_count = 15;
  optional string description = 16;
}

message CronTaskListResp {
  uint64 total = 1;
  repeated CronTaskInfo data = 2;
}

message DataTargetInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  //  目标名称
  optional string target_name = 5;
  //  目标编码
  optional string target_code = 6;
  //  描述
  optional string description = 7;
  //  目标类型: database, api, file, mq, cache
  optional string target_type = 8;
  //  目标系统名称
  optional string target_system = 9;
  //  连接配置JSON
  optional string connection_config = 10;
  //  认证配置JSON
  optional string auth_config = 11;
  //  是否启用
  optional bool is_active = 12;
  //  目标Schema定义JSON
  optional string target_schema = 13;
  //  验证规则JSON
  optional string validation_rules = 14;
  //  唯一键字段列表JSON
  optional string unique_keys = 15;
  //  扩展元数据JSON
  optional string metadata = 16;
}

message DataTargetListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string target_name = 6;
  optional string target_code = 7;
  optional string description = 8;
  optional string target_type = 9;
  optional string target_system = 10;
  optional string connection_config = 11;
  optional string auth_config = 12;
  optional bool is_active = 13;
  optional string target_schema = 14;
  optional string validation_rules = 15;
  optional string unique_keys = 16;
  optional string metadata = 17;
}

message DataTargetListResp {
  uint64 total = 1;
  repeated DataTargetInfo data = 2;
}

message DiscoveryPoolInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  //  发现池名称
  optional string name = 5;
  //  发现池描述
  optional string description = 6;
  //  发现类型: file, api, sdk, builtin
  optional string discovery_type = 7;
  //  池状态: active, inactive, error, maintain
  optional string pool_status = 8;
  //  发现配置JSON
  optional string discovery_config = 9;
  //  调度表达式
  optional string schedule = 10;
  //  批处理大小
  optional int64 batch_size = 11;
  //  并发限制
  optional int64 concurrent_limit = 12;
  //  最大重试次数
  optional int64 max_retry = 13;
  //  重试间隔(秒)
  optional int64 retry_interval = 14;
  //  字段映射配置JSON
  optional string field_mapping = 15;
  //  总执行次数
  optional int64 total_runs = 16;
  //  成功执行次数
  optional int64 success_runs = 17;
  //  失败执行次数
  optional int64 failed_runs = 18;
  //  最后执行时间
  optional int64 last_run_at = 19;
  //  最后成功时间
  optional int64 last_success_at = 20;
  //  最后错误信息
  optional string last_error = 21;
  //  审核状态: pending, approved, rejected
  optional string approval_status = 22;
  //  审核人ID
  optional uint64 approved_by = 23;
  //  审核时间
  optional int64 approved_at = 24;
  //  拒绝原因
  optional string rejection_reason = 25;
  //  扩展元数据JSON
  optional string metadata = 26;
}

message DiscoveryPoolListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string name = 6;
  optional string description = 7;
  optional string discovery_type = 8;
  optional string pool_status = 9;
  optional string discovery_config = 10;
  optional string schedule = 11;
  optional int64 batch_size = 12;
  optional int64 concurrent_limit = 13;
  optional int64 max_retry = 14;
  optional int64 retry_interval = 15;
  optional string field_mapping = 16;
  optional int64 total_runs = 17;
  optional int64 success_runs = 18;
  optional int64 failed_runs = 19;
  optional int64 last_run_at = 20;
  optional int64 last_success_at = 21;
  optional string last_error = 22;
  optional string approval_status = 23;
  optional uint64 approved_by = 24;
  optional int64 approved_at = 25;
  optional string rejection_reason = 26;
  optional string metadata = 27;
}

message DiscoveryPoolListResp {
  uint64 total = 1;
  repeated DiscoveryPoolInfo data = 2;
}

message DiscoveryPoolStatsResp {
  uint64 total_pools = 1;
  uint64 active_pools = 2;
  uint64 running_pools = 3;
  uint64 total_discoveries = 4;
  uint64 successful_discoveries = 5;
  uint64 failed_discoveries = 6;
}

message DiscoveryProviderSchemaInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  //  Provider唯一标识
  optional string provider_id = 5;
  //  Provider名称
  optional string provider_name = 6;
  //  Provider类别
  optional string category = 7;
  //  参数定义Schema(JSON)
  optional bytes parameter_schema = 8;
  //  字段定义Schema(JSON)
  optional bytes field_schema = 9;
  //  描述
  optional string description = 10;
  //  版本号
  optional string version = 11;
  //  图标URL
  optional string icon_url = 12;
  //  是否内置Provider
  optional bool is_builtin = 13;
  //  执行模式: worker-后台任务, agent-Agent执行, direct-直接执行
  optional string execution_mode = 14;
  //  是否启用
  optional bool is_active = 15;
}

message DiscoveryProviderSchemaListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string provider_id = 6;
  optional string provider_name = 7;
  optional string category = 8;
  optional bytes parameter_schema = 9;
  optional bytes field_schema = 10;
  optional string description = 11;
  optional string version = 12;
  optional string icon_url = 13;
  optional bool is_builtin = 14;
  optional string execution_mode = 15;
  optional bool is_active = 16;
}

message DiscoveryProviderSchemaListResp {
  uint64 total = 1;
  repeated DiscoveryProviderSchemaInfo data = 2;
}

message DiscoveryTemplateInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Status 1: normal 2: ban | 状态 1 正常 2 禁用
