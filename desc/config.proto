syntax = "proto3";

// Config Center messages

// ConfigItem 配置项信息
message ConfigItem {
  optional uint64 id = 1;
  optional uint64 tenant_id = 2;
  optional string config_key = 3;
  optional string config_value = 4;
  optional string value_type = 5;
  optional string category = 6;
  optional string service_name = 7;
  optional string description = 8;
  optional string default_value = 9;
  optional int64 version = 10;
  optional uint32 status = 11;
  optional bool is_readonly = 12;
  optional bool is_sensitive = 13;
  optional string scope = 14;
  optional string config_group = 15;
  optional int64 created_at = 16;
  optional int64 updated_at = 17;
}

// ConfigAuditLog 配置审计日志
message ConfigAuditLog {
  optional uint64 id = 1;
  optional uint64 tenant_id = 2;
  optional string config_key = 3;
  optional string old_value = 4;
  optional string new_value = 5;
  optional string change_type = 6;
  optional uint64 changed_by = 7;
  optional string changed_by_name = 8;
  optional string service_name = 9;
  optional string category = 10;
  optional string config_group = 11;
  optional string change_reason = 12;
  optional string ip_address = 13;
  optional string user_agent = 14;
  optional int64 old_version = 15;
  optional int64 new_version = 16;
  optional bool is_rollback = 17;
  optional string rollback_from_log_id = 18;
  optional int64 created_at = 19;
}

// ListConfigReq 配置列表请求
message ListConfigReq {
  optional uint64 page = 1;
  optional uint64 page_size = 2;
  optional string service_name = 3;
  optional string category = 4;
  optional string config_group = 5;
  optional string keyword = 6;
}

// ListConfigResp 配置列表响应
message ListConfigResp {
  optional uint64 total = 1;
  repeated ConfigItem data = 2;
}

// GetConfigReq 获取配置请求
message GetConfigReq {
  optional string config_key = 1;
}

// GetConfigResp 获取配置响应
message GetConfigResp {
  optional ConfigItem data = 1;
}

// CreateConfigReq 创建配置请求
message CreateConfigReq {
  optional string config_key = 1;
  optional string config_value = 2;
  optional string value_type = 3;
  optional string category = 4;
  optional string service_name = 5;
  optional string description = 6;
  optional string default_value = 7;
  optional bool is_readonly = 8;
  optional bool is_sensitive = 9;
  optional string scope = 10;
  optional string config_group = 11;
}

// UpdateConfigReq 更新配置请求
message UpdateConfigReq {
  optional string config_key = 1;
  optional string config_value = 2;
  optional string change_reason = 3;
}

// DeleteConfigReq 删除配置请求
message DeleteConfigReq {
  optional string config_key = 1;
}

// ListAuditLogReq 审计日志列表请求
message ListAuditLogReq {
  optional uint64 page = 1;
  optional uint64 page_size = 2;
  optional string config_key = 3;
  optional string change_type = 4;
  optional int64 start_time = 5;
  optional int64 end_time = 6;
}

// ListAuditLogResp 审计日志列表响应
message ListAuditLogResp {
  optional uint64 total = 1;
  repeated ConfigAuditLog data = 2;
}

// GetConfigHistoryReq 获取配置历史请求
message GetConfigHistoryReq {
  optional string config_key = 1;
}

// GetConfigHistoryResp 获取配置历史响应
message GetConfigHistoryResp {
  repeated ConfigAuditLog data = 1;
}

// RollbackConfigReq 回滚配置请求
message RollbackConfigReq {
  optional uint64 audit_log_id = 1;
  optional string change_reason = 2;
}

service Io {
  // group: config
  rpc listConfig(ListConfigReq) returns (ListConfigResp);
  // group: config
  rpc getConfig(GetConfigReq) returns (GetConfigResp);
  // group: config
  rpc createConfig(CreateConfigReq) returns (BaseResp);
  // group: config
  rpc updateConfig(UpdateConfigReq) returns (BaseResp);
  // group: config
  rpc deleteConfig(DeleteConfigReq) returns (BaseResp);
  // group: config
  rpc listAuditLog(ListAuditLogReq) returns (ListAuditLogResp);
  // group: config
  rpc getConfigHistory(GetConfigHistoryReq) returns (GetConfigHistoryResp);
  // group: config
  rpc rollbackConfig(RollbackConfigReq) returns (BaseResp);
}
