syntax = "proto3";

// InputTask message

message InputTaskInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  // 任务名称
  optional string task_name = 5;
  // 任务描述
  optional string description = 6;
  // 任务类型: manual, scheduled, triggered
  optional string task_type = 7;
  // 任务优先级
  optional int32 priority = 8;
  // 超时秒数
  optional int32 timeout_seconds = 9;
  // 任务配置JSON
  optional string task_config = 10;
  // 验证配置JSON
  optional string validation_config = 11;
  // 输出目标JSON
  optional string output_targets = 12;
  // 输入源: file, api, database, mq
  optional string input_source = 13;
  // 源配置JSON
  optional string source_config = 14;
  // 任务状态
  optional string task_status = 15;
  // 关联发现池ID
  optional uint64 discovery_pool_id = 16;
  // 计划执行时间
  optional int64  scheduled_at = 17;
  // 开始时间
  optional int64  started_at = 18;
  // 完成时间
  optional int64  completed_at = 19;
  // 总记录数
  optional int64 total_records = 20;
  // 已处理记录数
  optional int64 processed_records = 21;
  // 成功记录数
  optional int64 success_records = 22;
  // 失败记录数
  optional int64 failed_records = 23;
  // 错误信息
  optional string error_message = 24;
  // 错误详情JSON
  optional string error_details = 25;
  // 最大重试次数
  optional int32 max_retry = 26;
  // 重试次数
  optional int32 retry_count = 27;
  // 下次重试时间
  optional int64 next_retry_at = 28;
  // 工作节点ID
  optional string worker_id = 29;
  // 进度百分比
  optional float progress_percent = 30;
  // 进度消息
  optional string progress_message = 31;
  // 扩展元数据JSON
  optional string metadata = 32;
}

message InputTaskListResp {
  uint64 total = 1;
  repeated InputTaskInfo data = 2;
}

message InputTaskListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string task_name = 6;
  optional string task_type = 7;
  optional string input_source = 8;
  optional string source_config = 9;
  optional string task_status = 10;
  optional uint64 discovery_pool_id = 11;
  optional int64 scheduled_at = 12;
  optional int64 started_at = 13;
  optional int64 completed_at = 14;
  optional int64 total_records = 15;
  optional int64 processed_records = 16;
  optional int64 success_records = 17;
  optional int64 failed_records = 18;
  optional string error_message = 19;
  optional string metadata = 20;
}


service Io {

  // InputTask management
  // group: inputtask
  rpc createInputTask (InputTaskInfo) returns (BaseIDResp);
  // group: inputtask
  rpc updateInputTask (InputTaskInfo) returns (BaseResp);
  // group: inputtask
  rpc getInputTaskList (InputTaskListReq) returns (InputTaskListResp);
  // group: inputtask
  rpc getInputTaskById (IDReq) returns (InputTaskInfo);
  // group: inputtask
  rpc deleteInputTask (IDsReq) returns (BaseResp);

  // InputTask lifecycle operations
  // group: inputtask
  rpc approveInputTask (ApprovalReq) returns (BaseResp);
  // group: inputtask
  rpc startInputTask (IDReq) returns (BaseResp);
  // group: inputtask
  rpc pauseInputTask (IDReq) returns (BaseResp);
  // group: inputtask
  rpc cancelInputTask (IDReq) returns (BaseResp);


}