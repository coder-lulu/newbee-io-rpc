syntax = "proto3";

// DiscoveryProviderSchema message

message DiscoveryProviderSchemaInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  // Provider唯一标识
  optional string provider_id = 5;
  // Provider名称
  optional string provider_name = 6;
  // Provider类别
  optional string category = 7;
  // 参数定义Schema(JSON)
  optional bytes parameter_schema = 8;
  // 字段定义Schema(JSON)
  optional bytes field_schema = 9;
  // 描述
  optional string description = 10;
  // 版本号
  optional string version = 11;
  // 图标URL
  optional string icon_url = 12;
  // 是否内置Provider
  optional bool is_builtin = 13;
  // 执行模式: worker-后台任务, agent-Agent执行, direct-直接执行
  optional string execution_mode = 14;
  // 是否启用
  optional bool is_active = 15;
}

message DiscoveryProviderSchemaListResp {
  uint64 total = 1;
  repeated DiscoveryProviderSchemaInfo data = 2;
}

message DiscoveryProviderSchemaListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string provider_id = 6;
  optional string provider_name = 7;
  optional string category = 8;
  optional bytes parameter_schema = 9;
  optional bytes field_schema = 10;
  optional string description = 11;
  optional string version = 12;
  optional string icon_url = 13;
  optional bool is_builtin = 14;
  optional string execution_mode = 15;
  optional bool is_active = 16;
}


service Io {

  // DiscoveryProviderSchema management
  // group: discoveryproviderschema
  rpc createDiscoveryProviderSchema (DiscoveryProviderSchemaInfo) returns (BaseIDResp);
  // group: discoveryproviderschema
  rpc updateDiscoveryProviderSchema (DiscoveryProviderSchemaInfo) returns (BaseResp);
  // group: discoveryproviderschema
  rpc getDiscoveryProviderSchemaList (DiscoveryProviderSchemaListReq) returns (DiscoveryProviderSchemaListResp);
  // group: discoveryproviderschema
  rpc getDiscoveryProviderSchemaById (IDReq) returns (DiscoveryProviderSchemaInfo);
  // group: discoveryproviderschema
  rpc deleteDiscoveryProviderSchema (IDsReq) returns (BaseResp);


}