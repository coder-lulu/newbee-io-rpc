syntax = "proto3";

// OutputTask message

message OutputTaskInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  // 任务名称
  optional string task_name = 5;
  // 任务类型
  optional string task_type = 6;
  // 输出目标类型
  optional string output_target = 7;
  // 目标配置JSON
  optional string target_config = 8;
  // 任务状态
  optional string task_status = 9;
  // 关联数据目标ID
  optional uint64 data_target_id = 10;
  // 计划执行时间
  optional int64  scheduled_at = 11;
  // 开始时间
  optional int64  started_at = 12;
  // 完成时间
  optional int64  completed_at = 13;
  // 总记录数
  optional int64 total_records = 14;
  // 已处理记录数
  optional int64 processed_records = 15;
  // 成功记录数
  optional int64 success_records = 16;
  // 失败记录数
  optional int64 failed_records = 17;
  // 错误信息
  optional string error_message = 18;
  // 扩展元数据JSON
  optional string metadata = 19;
}

message OutputTaskListResp {
  uint64 total = 1;
  repeated OutputTaskInfo data = 2;
}

message OutputTaskListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional string task_name = 6;
  optional string task_type = 7;
  optional string output_target = 8;
  optional string target_config = 9;
  optional string task_status = 10;
  optional uint64 data_target_id = 11;
  optional int64 scheduled_at = 12;
  optional int64 started_at = 13;
  optional int64 completed_at = 14;
  optional int64 total_records = 15;
  optional int64 processed_records = 16;
  optional int64 success_records = 17;
  optional int64 failed_records = 18;
  optional string error_message = 19;
  optional string metadata = 20;
}


service Io {

  // OutputTask management
  // group: outputtask
  rpc createOutputTask (OutputTaskInfo) returns (BaseIDResp);
  // group: outputtask
  rpc updateOutputTask (OutputTaskInfo) returns (BaseResp);
  // group: outputtask
  rpc getOutputTaskList (OutputTaskListReq) returns (OutputTaskListResp);
  // group: outputtask
  rpc getOutputTaskById (IDReq) returns (OutputTaskInfo);
  // group: outputtask
  rpc deleteOutputTask (IDsReq) returns (BaseResp);

  // OutputTask lifecycle operations
  // group: outputtask
  rpc startOutputTask (IDReq) returns (BaseResp);
  // group: outputtask
  rpc pauseOutputTask (IDReq) returns (BaseResp);
  // group: outputtask
  rpc cancelOutputTask (IDReq) returns (BaseResp);


}